# R CMD check on three operating systems with release R, and once on Ubuntu
# with only the hard dependencies installed.
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'release'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: true
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
          extra-repositories: https://ocean-tracking-network.r-universe.dev
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'

  hard-dependencies-only:
    # Plain R CMD build and check, with the same commands as this job in the
    # four sibling packages. The action installs the hard dependencies and its
    # own two tools, pak and sessioninfo. The one Suggests, testthat, is not
    # installed. positionR has no vignettes; the two vignette flags keep the
    # commands the same.
    runs-on: ubuntu-latest
    name: ubuntu-latest (release, hard dependencies only)
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
      - name: Build and check with the hard dependencies only
        shell: bash
        run: |
          R CMD build --no-build-vignettes --no-manual .
          R CMD check --no-manual --ignore-vignettes positionR_*.tar.gz
          grep '^Status:' positionR.Rcheck/00check.log
          ! grep -Eq '^Status:.*(ERROR|WARNING)' positionR.Rcheck/00check.log
